name: Build and Release GoReplay ARM64

# 当推送以 'v' 开头的 tag 时触发，例如 v1.0.0
on:
  push:
    tags:
      - 'v*'
  # 也可以保留手动触发用于测试
  workflow_dispatch:

# 为 GITHUB_TOKEN 授予写入 Release 的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'   # 根据项目实际调整

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpcap-dev

    - name: Build for Linux ARM64
      run: |
        make release-bin-linux-arm64

    # 上传到 Release
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: dist/gor_linux_arm64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
