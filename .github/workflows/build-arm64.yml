name: Build & Release Goreplay (containerized arm64 CGO build)

on:
  push:
    tags:
      - 'v*'
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux]
        arch: [arm64]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install QEMU for multi‑arch build
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Go (for host builds)
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Compile gor with CGO (arm64 container)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
        run: |
          BIN_NAME="gor-${{ matrix.goos }}-${{ matrix.arch }}"

          if [ "${{ matrix.arch }}" = "arm64" ]; then
            # Build inside an arm64 golang image (qemu/binfmt must be set up above).
            # Rely on the golang image providing the go toolchain for arm64.
            docker run --rm --platform linux/arm64 \
              -v "${{ github.workspace }}":/work -w /work \
              golang:1.21-bullseye bash -c '\
                set -ex; \
                echo "=== container: go version ==="; \
                go version; \
                apt-get update && apt-get install -y --no-install-recommends libpcap-dev flex bison ca-certificates; \
                echo "=== container: building ==="; \
                CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -v -ldflags '\''-s -w'\'' -o /work/${BIN_NAME} ./cmd/gor'
            # Fix ownership of files created by container (they are root-owned).
            sudo chown "$(id -u):$(id -g)" "${BIN_NAME}" || true
          fi

      - name: Package tar.gz
        run: |
          BIN_NAME="gor-${{ matrix.goos }}-${{ matrix.arch }}"
          tar -zcvf "${BIN_NAME}.tar.gz" "${BIN_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gor-${{ matrix.goos }}-${{ matrix.arch }}
          path: |
            gor-${{ matrix.goos }}-${{ matrix.arch }}
            gor-${{ matrix.goos }}-${{ matrix.arch }}.tar.gz

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gor-${{ matrix.goos }}-${{ matrix.arch }}.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
