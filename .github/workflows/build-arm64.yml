name: Build GoReplay for Linux ARM64

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'   # 请根据项目 go.mod 实际版本调整

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpcap-dev

    - name: Build for Linux ARM64
      run: |
        make release-bin-linux-arm64

    - name: Upload ARM64 binary
      uses: actions/upload-artifact@v4
      with:
        name: goreplay-linux-arm64
        path: dist/gor_linux_arm64.tar.gz
