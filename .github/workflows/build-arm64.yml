name: Build and Release GoReplay for Linux ARM64

on:
  push:
    tags:
      - 'v*'                     # 推送 tag 时自动发布 Release
  workflow_dispatch:             # 支持手动触发

permissions:
  contents: write                # 允许上传 Release 资产

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'     # 请根据项目 go.mod 实际版本修改

      # 安装 ARM64 交叉编译工具链和 ARM64 版本的 libpcap 开发库
      - name: Install cross-compilation dependencies
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libpcap-dev:arm64

      # 获取动态版本号（基于 Git tag）
      - name: Get version
        id: version
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "DEV")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # 使用交叉编译构建静态二进制
      - name: Build for Linux ARM64
        run: |
          CC=aarch64-linux-gnu-gcc \
          CGO_ENABLED=1 \
          GOOS=linux \
          GOARCH=arm64 \
          go build -mod=vendor \
            -o gor \
            --tags "ngo" \
            -ldflags "-X main.VERSION=${VERSION} -extldflags '-static' -X main.DEMO=" \
            ./cmd/gor/

      # 打包成 tar.gz（与官方发布格式一致）
      - name: Package binary
        run: |
          mkdir -p dist
          tar -czf dist/gor_linux_arm64.tar.gz gor

      # 当是 tag 推送时，上传到 Release
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/gor_linux_arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
