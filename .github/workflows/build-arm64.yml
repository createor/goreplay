name: Build GoReplay ARM64 with Docker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置 QEMU 以支持多架构（ARM64）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Get version
        id: version
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "DEV")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build with Docker (ARM64)
        run: |
          docker run --platform linux/arm64 --rm \
            -v $(pwd):/workspace -w /workspace \
            -e GOOS=linux -e GOARCH=arm64 \
            golang:1.21-bullseye \
            bash -c "
              apt-get update && \
              apt-get install -y libpcap-dev && \
              go build -mod=vendor \
                -o gor \
                --tags 'ngo' \
                -ldflags '-X main.VERSION=${VERSION} -extldflags \"-static\" -X main.DEMO=' \
                ./cmd/gor/
            "

      - name: Package binary
        run: |
          mkdir -p dist
          tar -czf dist/gor_linux_arm64.tar.gz gor

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/gor_linux_arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
