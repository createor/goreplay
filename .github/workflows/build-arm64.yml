name: Build & Release Goreplay (full cgo arm64/amd64 with qemu)

on:
  push:
    tags:
      - 'v*'
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux]
        arch: [amd64, arm64]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 安装qemu，用于arm64 CGO跨编译，替代elastic私有docker镜像
      - name: Install QEMU for multi‑arch build
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21" # 匹配goreplay go.mod版本
          cache: true

      # 安装libpcap编译依赖（CGO编译必须）
      - name: Install build deps libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev flex bison

      - name: Compile gor with CGO (full capture capability)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
        run: |
          BIN_NAME="gor‑${{ matrix.goos }}‑${{ matrix.arch }}"
          # 静态链接libpcap，保证产物不依赖系统库
          go build -v \
            -ldflags "-s -w -extldflags '-static'" \
            -o "${BIN_NAME}" \
            ./cmd/goreplay

      - name: Package tar.gz
        run: |
          BIN_NAME="gor‑${{ matrix.goos }}‑${{ matrix.arch }}"
          tar -zcvf "${BIN_NAME}.tar.gz" "${BIN_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gor‑${{ matrix.goos }}‑${{ matrix.arch }}
          path: |
            gor‑${{ matrix.goos }}‑${{ matrix.arch }}
            gor‑${{ matrix.goos }}‑${{ matrix.arch }}.tar.gz

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gor‑${{ matrix.goos }}‑${{ matrix.arch }}.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
